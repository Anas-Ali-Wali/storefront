<section class="py-16 sm:py-24" style="background-color: var(--bg-color);">
  <div class="mx-auto max-w-7xl px-4 sm:px-6">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-end md:justify-between mb-10 md:mb-14">
      <div>
        <p class="text-xs font-bold uppercase tracking-[0.35em]"
           style="color: var(--primary-color);">Featured Collection</p>
        <h2 class="mt-3 text-3xl md:text-4xl lg:text-5xl font-extrabold"
            style="color: var(--text-color);">New Arrivals</h2>
      </div>
      <a routerLink="/shop"
         class="mt-5 md:mt-0 inline-flex items-center gap-2 text-sm font-bold"
         style="color: var(--primary-color);">View All →</a>
    </div>

    <!-- Grid -->
    <div class="grid gap-3 sm:gap-4 grid-cols-2 sm:grid-cols-3 lg:grid-cols-4">

      <a *ngFor="let product of products"
         [routerLink]="['/product', product.productId]"
         class="group block overflow-hidden border transition-transform duration-300 hover:-translate-y-1 product-card"
         [ngClass]="'card-style-' + cardStyle"
         style="border-color: rgba(128,128,128,0.15);">

        <!-- IMAGE -->
        <div class="relative overflow-hidden product-img-wrap">
          <img [src]="getImageUrl(product.imageUrl)"
               [alt]="product.name"
               loading="lazy"
               class="w-full h-full object-cover transition duration-500 group-hover:scale-105"/>

          <!-- BADGE -->
          <span class="absolute top-2 left-2 text-xs font-bold px-2 py-0.5"
                [ngClass]="getBadgeClass()"
                style="background: var(--primary-color); color: #fff;">
            New
          </span>

          <!-- CART BUTTON — desktop hover only -->
          <button
            (click)="addToCart(product); $event.preventDefault(); $event.stopPropagation()"
            class="absolute bottom-2 right-2 w-8 h-8 sm:w-9 sm:h-9 rounded-full
                   items-center justify-center opacity-0 group-hover:opacity-100
                   transition duration-300 sm:flex hidden"
            style="background: var(--button-color); color: var(--button-text-color);">
            &#128722;
          </button>
        </div>

        <!-- INFO -->
        <div class="product-info-wrap p-2.5 sm:p-3">
          <h3 class="font-semibold text-xs sm:text-sm truncate"
              style="color: var(--card-text);">
            {{ product.name }}
          </h3>
          <p class="text-xs truncate opacity-50 mt-0.5 product-desc"
             style="color: var(--card-text);">
            {{ product.description }}
          </p>
          <div class="flex items-center justify-between mt-1.5 sm:mt-2">
            <span class="text-xs sm:text-sm font-bold"
                  style="color: var(--primary-color);">
              PKR {{ product.price | number:'1.0-0' }}
            </span>

            <!-- CART BUTTON — mobile only -->
            <button
              (click)="addToCart(product); $event.preventDefault(); $event.stopPropagation()"
              class="sm:hidden w-7 h-7 rounded-full flex items-center justify-center text-xs"
              style="background: var(--button-color); color: var(--button-text-color);">
              &#128722;
            </button>

            <span class="text-xs opacity-40 product-stock"
                  style="color: var(--card-text);">
              Stock: {{ product.stockQty }}
            </span>
          </div>
        </div>

      </a>
    </div>
  </div>
</section>
